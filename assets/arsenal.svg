<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" role="img">
  <title>Cyberdeck Arsenal</title>
  <desc>Cyberpunk 2077 Netrunner tools and offensive capabilities</desc>
  <style>
    
text {
  font-family: ui-monospace, 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Menlo, Monaco, Consolas, monospace;
  font-size: 14px;
}
.dim { fill: #526075; }
.fg { fill: #D6DEEB; }
.cy { fill: #00F0FF; }
.yw { fill: #FCEE0A; }
.rd { fill: #FF003C; }
.gr { fill: #00FF66; }
.wh { fill: #FFFFFF; }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes glitch-yw {
  0%, 92%, 100% { transform: translate(0, 0); }
  93% { transform: translate(4px, -1px); }
  95% { transform: translate(-3px, 2px); }
  97% { transform: translate(2px, 0); }
}
@keyframes glitch-cy {
  0%, 92%, 100% { transform: translate(0, 0); }
  93% { transform: translate(-4px, 1px); }
  95% { transform: translate(3px, -2px); }
  97% { transform: translate(-2px, 0); }
}
@keyframes fly-av {
  from { transform: translate(-64px, 0); }
  to { transform: translate(944px, -45px); }
}
@keyframes fly-av-back {
  from { transform: translate(944px, -10px); }
  to { transform: translate(-64px, 25px); }
}
@keyframes av-beacon { 0%, 88%, 100% { opacity: 0; } 90%, 96% { opacity: 1; } }
@keyframes spotlight { 0%, 100% { opacity: 0.15; transform: rotate(-8deg); } 50% { opacity: 0.35; transform: rotate(12deg); } }

.cursor { animation: blink 1s step-end infinite; }
.dot-live { animation: pulse 1.8s ease-in-out infinite; }
.glitch-yw { animation: glitch-yw 5s linear infinite; }
.glitch-cy { animation: glitch-cy 5s linear infinite; }
.av-craft { animation: fly-av 24s linear infinite; }
.av-craft-back { animation: fly-av-back 30s linear infinite; }
.av-bl { animation: av-beacon 1.2s infinite; }
.spotlight-beam { animation: spotlight 8s ease-in-out infinite alternate; transform-origin: 350px 300px; }

  </style>
  <defs>
    
<pattern id="grid40" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00F0FF" stroke-opacity="0.06" stroke-width="1"/>
</pattern>
<pattern id="crt-scan" width="4" height="4" patternUnits="userSpaceOnUse">
  <rect width="4" height="1" fill="#000000" fill-opacity="0.22"/>
</pattern>
<filter id="glow-neon" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>
<filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="3"/>
</filter>
<linearGradient id="cyber-fog" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
  <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.08"/>
  <stop offset="100%" stop-color="#FF003C" stop-opacity="0.18"/>
</linearGradient>
<linearGradient id="beam-grad" x1="0" y1="1" x2="0" y2="0">
  <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.35"/>
  <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
</linearGradient>

  </defs>

  <!-- Background Base & 40px Alignment Grid -->
  <rect x="16" y="0" width="848" height="320" fill="#0B0F19"/>
  <rect x="16" y="0" width="848" height="320" fill="url(#grid40)"/>

  <!-- Neon Frame Rails -->
  <path d="M 16 -40 V 360 M 864 -40 V 360" fill="none" stroke="#00F0FF" stroke-width="4" stroke-opacity="0.4" filter="url(#glow-soft)"/>
  <path d="M 16 0 V 320 M 864 0 V 320" fill="none" stroke="#00F0FF" stroke-width="1.8" stroke-opacity="0.85"/>
  

  <!-- Body Content -->
  
    <!-- Terminal Heading -->
    <g transform="translate(52, 48)">
      <text x="0" y="0" class="yw" font-weight="800">&gt;&gt; [04 // NETRUNNER QUICKHACKS &amp; ARSENAL]</text>
      <text x="0" y="20" class="dim"><tspan class="rd">[root@cyberdeck ~]#</tspan> ./arsenal --list-cyberware --tier legendary</text>
    </g>

    <!-- Module 1: Web App Exploitation -->
    <rect x="30" y="80" width="406.0" height="100" fill="#070A0F" fill-opacity="0.6" stroke="#FCEE0A" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="30" y="80" width="406.0" height="22" fill="#FCEE0A" fill-opacity="0.15"/>
    <text x="40" y="95" font-size="11" font-weight="800" fill="#FCEE0A">[QUICKHACK // WEB APPLICATION SECURITY]</text>
    <text x="42" y="124" font-size="12" class="fg">&gt; Insecure Direct Object Reference (IDOR)</text>
    <text x="42" y="144" font-size="12" class="fg">&gt; Business Logic Hunting &amp; Flaws</text>
    <text x="42" y="164" font-size="12" class="fg">&gt; SSRF Bypass &amp; 2FA / Rate-Limit Audits</text>

    <!-- Module 2: Recon & OSINT -->
    <rect x="444.0" y="80" width="406.0" height="100" fill="#070A0F" fill-opacity="0.6" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="444.0" y="80" width="406.0" height="22" fill="#00F0FF" fill-opacity="0.15"/>
    <text x="454.0" y="95" font-size="11" font-weight="800" fill="#00F0FF">[DAEMON // RECONNAISSANCE &amp; OSINT]</text>
    <text x="456.0" y="124" font-size="12" class="fg">&gt; Attack Surface &amp; Asset Mapping</text>
    <text x="456.0" y="144" font-size="12" class="fg">&gt; Subdomain &amp; Cloud Exposure Discovery</text>
    <text x="456.0" y="164" font-size="12" class="fg">&gt; Automated Pentest Pipelines &amp; Probes</text>

    <!-- Module 3: Tooling & Systems -->
    <rect x="30" y="195" width="406.0" height="100" fill="#070A0F" fill-opacity="0.6" stroke="#FF003C" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="30" y="195" width="406.0" height="22" fill="#FF003C" fill-opacity="0.15"/>
    <text x="40" y="210" font-size="11" font-weight="800" fill="#FF003C">[CYBERWARE // WEAPONS &amp; RUNTIME]</text>
    <text x="42" y="239" font-size="12" class="fg">&gt; Python 3 · Bash Scripting · Kali Linux</text>
    <text x="42" y="259" font-size="12" class="fg">&gt; Burp Suite Pro · Wireshark · Nuclei</text>
    <text x="42" y="279" font-size="12" class="fg">&gt; Docker · Git · Linux Kernel Diagnostics</text>

    <!-- Module 4: Engineering & Realtime -->
    <rect x="444.0" y="195" width="406.0" height="100" fill="#070A0F" fill-opacity="0.6" stroke="#00FF66" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="444.0" y="195" width="406.0" height="22" fill="#00FF66" fill-opacity="0.15"/>
    <text x="454.0" y="210" font-size="11" font-weight="800" fill="#00FF66">[PROTOCOL // FULL-STACK ARCHITECTURE]</text>
    <text x="456.0" y="239" font-size="12" class="fg">&gt; Node.js &amp; Express.js Microservices</text>
    <text x="456.0" y="259" font-size="12" class="fg">&gt; Socket.IO Real-time Multiplayer Engines</text>
    <text x="456.0" y="279" font-size="12" class="fg">&gt; Web Audio API Synthesizers &amp; Tactile UI</text>
    
</svg>