<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img">
  <title>PALPARD Netrunner Cyberdeck</title>
  <desc>Cyberpunk console header for PALPARD</desc>
  <style>
    
text {
  font-family: ui-monospace, 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Menlo, Monaco, Consolas, monospace;
  font-size: 14px;
}
.dim { fill: #526075; }
.fg { fill: #D6DEEB; }
.cy { fill: #00F0FF; }
.yw { fill: #FCEE0A; }
.rd { fill: #FF003C; }
.gr { fill: #00FF66; }
.wh { fill: #FFFFFF; }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes glitch-yw {
  0%, 92%, 100% { transform: translate(0, 0); }
  93% { transform: translate(4px, -1px); }
  95% { transform: translate(-3px, 2px); }
  97% { transform: translate(2px, 0); }
}
@keyframes glitch-cy {
  0%, 92%, 100% { transform: translate(0, 0); }
  93% { transform: translate(-4px, 1px); }
  95% { transform: translate(3px, -2px); }
  97% { transform: translate(-2px, 0); }
}
@keyframes fly-av {
  from { transform: translate(-64px, 0); }
  to { transform: translate(944px, -45px); }
}
@keyframes fly-av-back {
  from { transform: translate(944px, -10px); }
  to { transform: translate(-64px, 25px); }
}
@keyframes av-beacon { 0%, 88%, 100% { opacity: 0; } 90%, 96% { opacity: 1; } }
@keyframes spotlight { 0%, 100% { opacity: 0.15; transform: rotate(-8deg); } 50% { opacity: 0.35; transform: rotate(12deg); } }

.cursor { animation: blink 1s step-end infinite; }
.dot-live { animation: pulse 1.8s ease-in-out infinite; }
.glitch-yw { animation: glitch-yw 5s linear infinite; }
.glitch-cy { animation: glitch-cy 5s linear infinite; }
.av-craft { animation: fly-av 24s linear infinite; }
.av-craft-back { animation: fly-av-back 30s linear infinite; }
.av-bl { animation: av-beacon 1.2s infinite; }
.spotlight-beam { animation: spotlight 8s ease-in-out infinite alternate; transform-origin: 350px 300px; }

  </style>
  <defs>
    
<pattern id="grid40" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00F0FF" stroke-opacity="0.06" stroke-width="1"/>
</pattern>
<pattern id="crt-scan" width="4" height="4" patternUnits="userSpaceOnUse">
  <rect width="4" height="1" fill="#000000" fill-opacity="0.22"/>
</pattern>
<filter id="glow-neon" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>
<filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="3"/>
</filter>
<linearGradient id="cyber-fog" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
  <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.08"/>
  <stop offset="100%" stop-color="#FF003C" stop-opacity="0.18"/>
</linearGradient>
<linearGradient id="beam-grad" x1="0" y1="1" x2="0" y2="0">
  <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.35"/>
  <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
</linearGradient>

  </defs>

  <!-- Background Base & 40px Alignment Grid -->
  <rect x="16" y="16" width="848" height="344" fill="#0B0F19"/>
  <rect x="16" y="16" width="848" height="344" fill="url(#grid40)"/>

  <!-- Neon Frame Rails -->
  <path d="M 16 16 V 400 M 864 16 V 400 M 16 16 H 864" fill="none" stroke="#00F0FF" stroke-width="4" stroke-opacity="0.4" filter="url(#glow-soft)"/>
  <path d="M 16 16 V 360 M 864 16 V 360 M 16 16 H 864" fill="none" stroke="#00F0FF" stroke-width="1.8" stroke-opacity="0.85"/>
  
        <path d="M 10 32 V 10 H 32" fill="none" stroke="#FCEE0A" stroke-width="2"/>
        <path d="M 848 10 H 870 V 32" fill="none" stroke="#FCEE0A" stroke-width="2"/>
        <rect x="36" y="13" width="30" height="6" fill="#FCEE0A"/>
        <rect x="814" y="13" width="30" height="6" fill="#FCEE0A"/>
        

  <!-- Body Content -->
  
    <!-- Top Cyberpunk Status Bar Strip -->
    <rect x="16" y="16" width="848" height="36" fill="#070A0F" fill-opacity="0.9" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="16" y1="52" x2="864" y2="52" stroke="#00F0FF" stroke-opacity="0.75" stroke-width="1.5"/>

    <!-- Pod 1 (Left): Terminal Subsystem Node with generous padding -->
    <g transform="translate(26, 21)">
      <rect x="0" y="0" width="285" height="26" rx="3" fill="#060912" stroke="#00F0FF" stroke-opacity="0.55" stroke-width="1.2"/>
      <rect x="0" y="0" width="285" height="26" rx="3" fill="#00F0FF" fill-opacity="0.08"/>
      <circle class="dot-live" cx="13" cy="13" r="3.5" fill="#00FF66" filter="url(#glow-neon)"/>
      <text x="25" y="13" dominant-baseline="central" font-size="10" font-weight="700" letter-spacing="0.8" fill="#00F0FF">SYS://CYBERDECK · NODE:PALPARD</text>
    </g>

    <!-- Center Status Indicator -->
    <text x="440" y="34" dominant-baseline="central" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="2" fill="#526075">CONSOLE // ONLINE</text>

    <!-- Pod 2 (Right): Hardware Telemetry & ICE Status -->
    <g transform="translate(589, 21)">
      <rect x="0" y="0" width="265" height="26" rx="3" fill="#060912" stroke="#00F0FF" stroke-opacity="0.55" stroke-width="1.2"/>
      <rect x="0" y="0" width="265" height="26" rx="3" fill="#00F0FF" fill-opacity="0.08"/>
      <text x="132" y="13" dominant-baseline="central" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.8" fill="#00F0FF">RAM: 16/16 // ICE: BYPASSED</text>
    </g>

    <!-- Angled Cyberpunk Tech Accent Badge (Wider polygon covering full text) -->
    <polygon points="32,52 48,72 240,72 256,52" fill="#FCEE0A" fill-opacity="0.2"/>
    <polygon points="32,52 48,72 240,72 256,52" fill="none" stroke="#FCEE0A" stroke-opacity="0.75" stroke-width="1.2"/>
    <text x="54" y="62" dominant-baseline="central" font-size="9.5" font-weight="800" letter-spacing="1.5" fill="#FCEE0A">NETRUNNER CONSOLE v3.2</text>

    <!-- Terminal Command Line Prompt -->
    <text x="52" y="104" dominant-baseline="central" class="dim"><tspan class="rd">[root@cyberdeck ~]#</tspan> whoami --status</text>

    <!-- Chromatic Aberration Glitch Title: PALPARD (Commanding 68px Hero Scale) -->
    <g transform="translate(52, 156)" font-weight="900" letter-spacing="6" style="font-size: 64px;">
      <!-- Crimson Shadow Layer -->
      <g class="glitch-cy">
        <text x="3" y="0" dominant-baseline="central" fill="#FF003C" opacity="0.85">PALPARD</text>
      </g>
      <!-- Cyan Shadow Layer -->
      <g class="glitch-yw">
        <text x="-3" y="0" dominant-baseline="central" fill="#00F0FF" opacity="0.85">PALPARD</text>
      </g>
      <!-- Main Signature Cyberpunk Yellow -->
      <text x="0" y="0" dominant-baseline="central" fill="#FCEE0A" filter="url(#glow-soft)">PALPARD</text>
      <text x="0" y="0" dominant-baseline="central" fill="#FCEE0A">PALPARD</text>
    </g>

    <!-- Operator Specs HUD Box with Neon Framing -->
    <g transform="translate(52, 224)">
      <text x="0" y="0" dominant-baseline="central" class="fg"><tspan class="yw">&gt;&gt; OPERATOR:</tspan> TAHA <tspan class="dim">//</tspan> <tspan class="cy">PALPARD</tspan></text>
      <text x="0" y="25" dominant-baseline="central" class="fg"><tspan class="yw">&gt;&gt; CLASS:</tspan> SECURITY RESEARCHER &amp; BUG BOUNTY SPECIALIST</text>
      <text x="0" y="50" dominant-baseline="central" class="fg"><tspan class="yw">&gt;&gt; SPECIALIZATION:</tspan> IDOR · BUSINESS LOGIC · SSRF · RECON AUTOMATION</text>
      <text x="0" y="75" dominant-baseline="central" class="fg"><tspan class="yw">&gt;&gt; CYBERWARE:</tspan> MILITECH &quot;SANDEVISTAN&quot; MK.IV <tspan class="dim">//</tspan> ARASAKA OSINT DECK</text>
    </g>

    <!-- Right HUD Subsystem: Netrunner Uplink Status (Balances empty right space) -->
    <g transform="translate(622, 112)">
      <rect x="0" y="0" width="232" height="188" rx="3" fill="#060912" fill-opacity="0.85" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1.2"/>
      <rect x="0" y="0" width="232" height="22" rx="3" fill="#00F0FF" fill-opacity="0.12"/>
      <text x="10" y="11" dominant-baseline="central" font-size="9" font-weight="800" letter-spacing="0.5" fill="#00F0FF">[DECK MATRIX // TELEMETRY]</text>
      
      <!-- Metrics & Status Bars -->
      <text x="12" y="38" dominant-baseline="central" font-size="9.5" class="dim">NEURAL SYNC:</text>
      <text x="220" y="38" dominant-baseline="central" text-anchor="end" font-size="10" font-weight="700" class="gr">99.8%</text>
      <rect x="12" y="47" width="208" height="4" fill="#141E2E"/>
      <rect x="12" y="47" width="192" height="4" fill="#00FF66"/>

      <text x="12" y="68" dominant-baseline="central" font-size="9.5" class="dim">ICE DEFENSE:</text>
      <text x="220" y="68" dominant-baseline="central" text-anchor="end" font-size="10" font-weight="700" class="cy">SECURE</text>
      <rect x="12" y="77" width="208" height="4" fill="#141E2E"/>
      <rect x="12" y="77" width="174" height="4" fill="#00F0FF"/>

      <text x="12" y="98" dominant-baseline="central" font-size="9.5" class="dim">GATEWAY ICE:</text>
      <text x="220" y="98" dominant-baseline="central" text-anchor="end" font-size="10" font-weight="700" class="yw">BYPASSED</text>
      <rect x="12" y="107" width="208" height="4" fill="#141E2E"/>
      <rect x="12" y="107" width="204" height="4" fill="#FCEE0A"/>

      <!-- Sub-link Card -->
      <g transform="translate(10, 128)">
        <rect x="0" y="0" width="212" height="48" rx="2" fill="#00F0FF" fill-opacity="0.08" stroke="#00F0FF" stroke-opacity="0.25"/>
        <circle class="dot-live" cx="12" cy="18" r="3.5" fill="#00FF66" filter="url(#glow-neon)"/>
        <text x="24" y="16" dominant-baseline="central" font-size="9.5" font-weight="700" fill="#D6DEEB">NETRUNNER LINK: <tspan class="yw">ONLINE</tspan></text>
        <text x="24" y="32" dominant-baseline="central" font-size="8.5" class="dim">NIGHT CITY · CORPO PLAZA</text>
      </g>
    </g>

    <!-- Blinking Prompt (Cursor with 8px clearance, no overlap with ]$) -->
    <g transform="translate(52, 332)">
      <text x="0" y="0" dominant-baseline="central" class="rd">[netrunner@night-city]$</text>
      <rect class="cursor" x="204" y="-9" width="10" height="18" fill="#FCEE0A" filter="url(#glow-neon)"/>
    </g>

    <!-- CRT Scanline Mask -->
    <rect x="16" y="53" width="848" height="307" fill="url(#crt-scan)" pointer-events="none"/>
    
</svg>